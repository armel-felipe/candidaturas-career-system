services:
  vagas_bot_01:
    build:
      context: /opt/agent-projects/candidaturas/hermes-src
    image: candidaturas/hermes-agent:0.18.2
    container_name: hermes-vagas-bot-01
    restart: unless-stopped
    ports:
      - "127.0.0.1:6081:6080"
    environment:
      HERMES_HOME: /opt/data
      CAREER_HERMES_PROFILE_ID: "16f204534852"
      CAREER_HERMES_PROFILE_NAME: vagas_bot_01
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      CAREER_CONTROL_DB_PATH: /workspace/candidaturas/.career-control/career.db
      CAREER_AUTHORITY_LEDGER_PATH: /workspace/candidaturas/.career-control/authority.json
      CAREER_CONTROL_DB_ID: control_9c0aceb3a5cf4441abf5417fc55f5ffc
      CAREER_RUNTIME_PERSISTENCE_MODE: sqlite_only
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace/candidaturas
      LINKEDIN_NOVNC_PUBLIC_PORT: "6081"
      RCLONE_CONFIG: /opt/data/.config/rclone/rclone.conf
      RCLONE_ONEDRIVE_REMOTE: onedrive
      RCLONE_ONEDRIVE_DELIVERY_DIR: 01_armel/Curriculos/personalizados
      HERMES_ACCEPT_HOOKS: "1"
    volumes:
      - /opt/agent-projects/candidaturas/hermes/runtime/vagas_bot_01:/opt/data
      - /opt/agent-projects/candidaturas/hermes/vagas_bot_01:/opt/data/profiles/vagas_bot_01
      - /opt/agent-projects/candidaturas:/workspace/candidaturas:ro
      - /opt/agent-projects/candidaturas/control-plane:/workspace/candidaturas/.career-control:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_01/state:/workspace/candidaturas/.career-state:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_01/inbox:/workspace/candidaturas/inbox:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_01/outputs:/workspace/candidaturas/outputs:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_01/env:/workspace/candidaturas/.env:rw
      - /opt/agent-projects/candidaturas/playwright:/opt/hermes/.playwright
      - /usr/bin/rclone:/usr/local/bin/rclone:ro
    working_dir: /workspace/candidaturas
    command: ["--profile", "vagas_bot_01", "gateway", "run"]
    networks: [hermes]

  vagas_bot_02:
    build:
      context: /opt/agent-projects/candidaturas/hermes-src
    image: candidaturas/hermes-agent:0.18.2
    container_name: hermes-vagas-bot-02
    restart: unless-stopped
    ports:
      - "127.0.0.1:6082:6080"
    environment:
      HERMES_HOME: /opt/data
      CAREER_HERMES_PROFILE_ID: "bcc27ffe51db"
      CAREER_HERMES_PROFILE_NAME: vagas_bot_02
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      CAREER_CONTROL_DB_PATH: /workspace/candidaturas/.career-control/career.db
      CAREER_AUTHORITY_LEDGER_PATH: /workspace/candidaturas/.career-control/authority.json
      CAREER_CONTROL_DB_ID: control_9c0aceb3a5cf4441abf5417fc55f5ffc
      CAREER_RUNTIME_PERSISTENCE_MODE: sqlite_only
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace/candidaturas
      LINKEDIN_NOVNC_PUBLIC_PORT: "6082"
      RCLONE_CONFIG: /opt/data/.config/rclone/rclone.conf
      RCLONE_ONEDRIVE_REMOTE: onedrive
      RCLONE_ONEDRIVE_DELIVERY_DIR: 01_armel/Curriculos/personalizados
      HERMES_ACCEPT_HOOKS: "1"
    volumes:
      - /opt/agent-projects/candidaturas/hermes/runtime/vagas_bot_02:/opt/data
      - /opt/agent-projects/candidaturas/hermes/vagas_bot_02:/opt/data/profiles/vagas_bot_02
      - /opt/agent-projects/candidaturas:/workspace/candidaturas:ro
      - /opt/agent-projects/candidaturas/control-plane:/workspace/candidaturas/.career-control:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_02/state:/workspace/candidaturas/.career-state:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_02/inbox:/workspace/candidaturas/inbox:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_02/outputs:/workspace/candidaturas/outputs:rw
      - /opt/agent-projects/candidaturas/workspaces/vagas_bot_02/env:/workspace/candidaturas/.env:rw
      - /opt/agent-projects/candidaturas/playwright:/opt/hermes/.playwright
      - /usr/bin/rclone:/usr/local/bin/rclone:ro
    working_dir: /workspace/candidaturas
    command: ["--profile", "vagas_bot_02", "gateway", "run"]
    networks: [hermes]

networks:
  hermes:
    driver: bridge
